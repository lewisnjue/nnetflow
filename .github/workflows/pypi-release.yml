name: Publish to PyPI on Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'The version to build and publish (e.g., 1.2.3)'
        required: true
        type: string

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Updated to match your requires-python = ">=3.11"
      
      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-build
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Installs nnetflow + dependencies + optional test dependencies
          pip install ".[test]"
          # Overwrite standard torch with CPU-only wheel for faster CI
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      
      - name: Run tests before publishing
        run: |
          pytest tests/ -v
      
      - name: Install build tools
        run: |
          pip install build twine
      
      - name: Set version
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            VERSION=${{ github.event.release.tag_name }}
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION=${{ github.event.inputs.version }}
          fi

          if [[ -z "$VERSION" ]]; then
            echo "Error: Could not determine version."
            exit 1
          fi

          VERSION=${VERSION#v}
          echo "Release version: $VERSION"

          # Update only the pyproject.toml
          sed -i "s/^version = .*/version = \"$VERSION\"/" pyproject.toml
  
      - name: Build package
        run: |
          python -m build
      
      - name: Check package
        run: |
          twine check dist/*
      
      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          twine upload dist/* --non-interactive