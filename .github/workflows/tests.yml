name: Tests

on:
  push: {}
  pull_request: {}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Updated to match requires-python = ">=3.11" in pyproject.toml
        python-version: ['3.11', '3.12', '3.13']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run pre-commit hooks
        uses: pre-commit/action@v2.0.3
        with:
          extra_args: --all-files
        continue-on-error: true
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          # Now hashes your pyproject.toml instead of the deleted requirements files
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Installs the main package and the optional 'test' dependencies (pytest, pytest-cov)
          pip install ".[test]"
          # Install CPU-only torch to keep CI fast (as it's in your dev group)
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      
      - name: Run tests with pytest
        run: |
          pytest tests/ -v --cov=nnetflow --cov-report=term-missing
      
      - name: Generate coverage report
        if: matrix.python-version == '3.12'
        run: |
          pytest tests/ --cov=nnetflow --cov-report=xml
      
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}